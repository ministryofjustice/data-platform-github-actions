---
on:
  workflow_call:
    inputs:
      build-context:
        type: string
        required: false
        default: "."
      clean-runner:
        type: boolean
        required: false
        default: false
      containerfile-path:
        type: string
        required: false
        default: "Containerfile"

permissions: {}

jobs:
  container-release:
    name: Container Release
    runs-on: ubuntu-24.04-arm
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Harden Runner
        if: github.event.repository.private == false
        id: harden_runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Clean Runner
        if: inputs.clean-runner == true
        id: clean_runner
        uses: ministryofjustice/action-clean-runner@390530713a326ddc099b2114f38dd0f2f8eac6da # v1.1.0
        with:
          confirm: true

      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Log in to GitHub Container Registry
        id: login_ghcr
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: build_and_push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.build-context }} # zizmor: ignore[template-injection]
          file: ${{ inputs.containerfile-path }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Generate SBOM
        id: generate_sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build_and_push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: GitHub Build Provenance Attestation
        id: attest_build_provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build_and_push.outputs.digest }}
          push-to-registry: true

      - name: GitHub SBOM Attestation
        id: attest_sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build_and_push.outputs.digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true

      - name: GitHub Attestation Verification
        id: attest_verification
        shell: bash
        env:
          DIGEST: ${{ steps.build_and_push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_REPOSITORY: ${{ github.repository }}
        run: |
          gh attestation verify \
            "oci://ghcr.io/${IMAGE_REPOSITORY}@${DIGEST}" \
            --repo "${IMAGE_REPOSITORY}" \
            --signer-workflow ministryofjustice/data-platform-github-actions/.github/workflows/container-release.yml
